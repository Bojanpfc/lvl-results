<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Mobile • LVL</title>

<style>

:root{
    --bg:#050914;
    --bg2:#081226;
    --card:#0c172b;
    --card2:#101e36;
    --line:rgba(255,255,255,.08);

    --blue:#2487ff;
    --blue2:#00c6ff;
    --purple:#735cff;

    --green:#20e39a;
    --red:#ff4968;
    --yellow:#ffc857;

    --text:#ffffff;
    --muted:#8d9bb5;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(36,135,255,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 100% 40%,
            rgba(115,92,255,.10),
            transparent 30%
        ),

        var(--bg);

    padding-bottom:40px;
}

.container{
    width:100%;
    max-width:560px;

    margin:auto;

    padding:18px 14px 40px;
}


/* =========================================
   HEADER
========================================= */

.header{
    text-align:center;

    padding:12px 0 22px;
}

.logo{
    display:inline-flex;

    align-items:center;

    gap:8px;

    font-size:13px;

    font-weight:800;

    letter-spacing:3px;

    color:#a9cfff;

    text-transform:uppercase;
}

.logo-icon{
    width:28px;
    height:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    box-shadow:
        0 0 20px rgba(36,135,255,.4);
}

.header h1{
    margin-top:12px;

    font-size:38px;

    line-height:1;

    font-weight:900;

    letter-spacing:-1px;
}

.header p{
    margin-top:8px;

    font-size:12px;

    color:var(--muted);

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================================
   MATCH CARD
========================================= */

.match-card{
    position:relative;

    overflow:hidden;

    padding:24px 16px 20px;

    border:1px solid var(--line);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.01)
        ),

        var(--card);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.match-card::before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    left:50%;
    top:-150px;

    transform:translateX(-50%);

    background:
        rgba(36,135,255,.25);

    filter:blur(60px);
}


/* =========================================
   LIVE
========================================= */

.live{
    position:relative;

    display:flex;

    justify-content:center;

    margin-bottom:12px;
}

.live span{
    display:flex;

    align-items:center;

    gap:7px;

    padding:6px 12px;

    border-radius:30px;

    background:
        rgba(32,227,154,.08);

    border:
        1px solid rgba(32,227,154,.2);

    color:var(--green);

    font-size:10px;

    font-weight:800;

    letter-spacing:2px;
}

.live-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px var(--green);

    animation:
        pulse 1.4s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.4;
        transform:scale(.7);
    }

}


/* =========================================
   TEAMS
========================================= */

.teams{
    position:relative;

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:10px;

    margin-top:18px;
}

.team{
    text-align:center;
}

.team-name{
    font-size:13px;

    font-weight:800;

    color:#cbd6e8;

    text-transform:uppercase;

    line-height:1.3;

    word-break:break-word;
}

.team:first-child .team-name{
    color:#ffffff;
}

.team-logo{
    width:60px;
    height:60px;

    margin:
        0 auto 9px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #172a4a,
            #0b1528
        );

    border:
        1px solid rgba(255,255,255,.08);

    font-size:25px;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.05),

        0 10px 25px
        rgba(0,0,0,.25);
}

.score{
    font-size:42px;

    font-weight:900;

    letter-spacing:-2px;

    white-space:nowrap;
}

.score-separator{
    font-size:24px;

    color:#52617b;

    margin-top:-4px;
}


/* =========================================
   COUNTDOWN
========================================= */

.countdown-box{
    position:relative;

    margin-top:25px;

    padding:14px;

    border-radius:16px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid var(--line);

    text-align:center;
}

.countdown-label{
    font-size:9px;

    font-weight:800;

    letter-spacing:2px;

    color:var(--muted);

    text-transform:uppercase;
}

.countdown{
    margin-top:6px;

    font-size:25px;

    font-weight:900;

    letter-spacing:3px;

    font-variant-numeric:
        tabular-nums;
}

.countdown.warning{
    color:var(--yellow);
}

.countdown.danger{
    color:var(--red);
}


/* =========================================
   PROGRESS
========================================= */

.progress-section{
    margin-top:22px;
}

.progress-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;
}

.progress-title{
    font-size:11px;

    color:var(--muted);

    font-weight:700;

    letter-spacing:1px;
}

.progress-number{
    font-size:12px;

    font-weight:900;
}

.progress{
    height:8px;

    overflow:hidden;

    border-radius:20px;

    background:#17233a;
}

.progress-bar{
    width:0%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 0 14px
        rgba(36,135,255,.5);

    transition:.4s;
}


/* =========================================
   FORM
========================================= */

.form-card{
    margin-top:14px;

    padding:20px 16px;

    border-radius:22px;

    background:var(--card);

    border:
        1px solid var(--line);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.section-title{
    font-size:13px;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;

    margin-bottom:15px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;

    margin-bottom:7px;

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

select,
input{
    width:100%;

    height:54px;

    padding:0 15px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:#081327;

    color:white;

    font-size:15px;

    font-weight:700;

    transition:.2s;
}

select:focus,
input:focus{

    border-color:
        rgba(36,135,255,.7);

    box-shadow:
        0 0 0 3px
        rgba(36,135,255,.1);
}

select{
    appearance:auto;
}

input[type="number"]{

    text-align:center;

    font-size:24px;

    font-weight:900;
}


/* =========================================
   SUBMIT BUTTON
========================================= */

.submit-btn{
    width:100%;

    height:58px;

    border:0;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-size:13px;

    font-weight:900;

    letter-spacing:1.5px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    box-shadow:
        0 10px 30px
        rgba(36,135,255,.25);

    transition:.2s;
}

.submit-btn:hover{

    transform:
        translateY(-1px);

    box-shadow:
        0 14px 35px
        rgba(36,135,255,.35);
}

.submit-btn:active{

    transform:
        scale(.98);
}

.submit-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =========================================
   STATUS
========================================= */

.status{
    display:none;

    margin-top:14px;

    padding:13px 14px;

    border-radius:13px;

    font-size:12px;

    font-weight:700;

    line-height:1.4;
}

.status.success{

    display:block;

    color:var(--green);

    background:
        rgba(32,227,154,.08);

    border:
        1px solid
        rgba(32,227,154,.2);
}

.status.error{

    display:block;

    color:var(--red);

    background:
        rgba(255,73,104,.08);

    border:
        1px solid
        rgba(255,73,104,.2);
}


/* =========================================
   INFO
========================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:14px;
}

.info-card{

    padding:17px 14px;

    border-radius:18px;

    background:var(--card);

    border:
        1px solid var(--line);

    text-align:center;
}

.info-icon{

    font-size:20px;

    margin-bottom:8px;
}

.info-label{

    font-size:9px;

    color:var(--muted);

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;
}

.info-value{

    margin-top:5px;

    font-size:15px;

    font-weight:900;
}


/* =========================================
   FOOTER
========================================= */

.footer{

    text-align:center;

    margin-top:24px;

    color:#46536b;

    font-size:9px;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================================
   NO ACTIVE LVL
========================================= */

.no-lvl{

    text-align:center;

    padding:45px 20px;
}

.no-lvl-icon{

    font-size:45px;

    margin-bottom:15px;
}

.no-lvl-title{

    font-size:20px;

    font-weight:900;

    letter-spacing:1px;
}

.no-lvl-text{

    margin-top:8px;

    color:var(--muted);

    font-size:12px;

    line-height:1.5;
}


/* =========================================
   LOADING
========================================= */

.loading{

    text-align:center;

    padding:30px 10px;

    color:var(--muted);

    font-size:12px;

    letter-spacing:1px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:380px){

    .header h1{
        font-size:34px;
    }

    .score{
        font-size:36px;
    }

    .team-logo{
        width:52px;
        height:52px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     HEADER
======================================= -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            ⚡
        </div>

        FC MOBILE

    </div>


    <h1>
        LVL TOURNAMENT
    </h1>


    <p>
        Daily competition
    </p>

</header>



<!-- ======================================
     MATCH CARD
======================================= -->

<section
    class="match-card"
    id="matchCard"
>


    <div class="loading" id="loading">

        Loading current LVL...

    </div>


    <div id="matchContent" style="display:none;">


        <!-- LIVE -->

        <div class="live">

            <span>

                <i class="live-dot"></i>

                LIVE

            </span>

        </div>



        <!-- TEAMS -->

        <div class="teams">


            <div class="team">

                <div class="team-logo">
                    ⚡
                </div>

                <div class="team-name">
                    YOUR TEAM
                </div>

            </div>



            <div>

                <div class="score">

                    <span
                        id="ourScore"
                    >
                        0
                    </span>

                    <span
                        class="score-separator"
                    >
                        :
                    </span>

                    <span
                        id="opponentScore"
                    >
                        0
                    </span>

                </div>

            </div>



            <div class="team">

                <div class="team-logo">
                    🛡️
                </div>

                <div
                    class="team-name"
                    id="opponentName"
                >
                    OPPONENT
                </div>

            </div>


        </div>



        <!-- COUNTDOWN -->

        <div class="countdown-box">

            <div class="countdown-label">
                Time remaining
            </div>

            <div
                class="countdown"
                id="countdown"
            >
                00:00:00
            </div>

        </div>



        <!-- PROGRESS -->

        <div class="progress-section">


            <div class="progress-top">

                <div class="progress-title">
                    PLAYER SUBMISSIONS
                </div>

                <div
                    class="progress-number"
                    id="progressNumber"
                >
                    0 / 32
                </div>

            </div>



            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


        </div>


    </div>


</section>



<!-- ======================================
     SUBMIT FORM
======================================= -->

<section
    class="form-card"
    id="formCard"
>


    <div
        class="section-title"
    >
        ⚽ Submit your result
    </div>



    <div
        id="formContent"
    >


        <div class="field">

            <label for="player">

                Select your name

            </label>


            <select id="player">

                <option value="">

                    Loading players...

                </option>

            </select>

        </div>



        <div class="field">

            <label for="goals">

                Your goals

            </label>


            <input
                type="number"
                id="goals"
                min="0"
                max="99"
                placeholder="0"
            >

        </div>



        <button
            class="submit-btn"
            id="submitBtn"
            onclick="submitResult()"
        >

            ⚡ SUBMIT RESULT

        </button>



        <div
            class="status"
            id="status"
        ></div>


    </div>


</section>



<!-- ======================================
     INFO
======================================= -->

<div class="info-grid">


    <div class="info-card">

        <div class="info-icon">
            🏆
        </div>

        <div class="info-label">
            LVL
        </div>

        <div
            class="info-value"
            id="lvlNumber"
        >
            —
        </div>

    </div>



    <div class="info-card">

        <div class="info-icon">
            👥
        </div>

        <div class="info-label">
            Players
        </div>

        <div
            class="info-value"
            id="totalPlayers"
        >
            32
        </div>

    </div>


</div>



<div class="footer">

    FC MOBILE • LVL SYSTEM

</div>


</div>



<script>


/* ==================================================
   API
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby3nXVRE6Z1ZB4kQA4o037qJfwoeqhTq0YOwqxVoye4pAHbp1BuZustn9qmMx-E8d19/exec";


/* ==================================================
   VARIABLES
================================================== */

let tournament = null;

let players = [];

let countdownTimer = null;


/* ==================================================
   API GET
================================================== */

async function apiGet(action){

    const response =
        await fetch(
            API_URL +
            "?action=" +
            encodeURIComponent(action)
        );


    if(!response.ok){

        throw new Error(
            "API request failed."
        );

    }


    const data =
        await response.json();


    if(!data.success){

        throw new Error(
            data.error ||
            "API error."
        );

    }


    return data.data;

}


/* ==================================================
   LOAD LIVE LVL
================================================== */

async function loadLiveLVL(){

    try{

        const data =
            await apiGet(
                "liveLVL"
            );


        if(
            !data ||
            !data.active ||
            !data.tournament
        ){

            showNoActiveLVL();

            return;

        }


        tournament =
            data.tournament;


        players =
            data.players || [];


        updateTournamentUI(
            data
        );


        populatePlayers(
            players
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "matchContent"
        ).style.display =
            "block";


        document.getElementById(
            "formCard"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            error
        );


        showError(
            "Unable to load the current LVL. Please try again."
        );

    }

}


/* ==================================================
   SHOW NO ACTIVE LVL
================================================== */

function showNoActiveLVL(){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "matchContent"
    ).style.display =
        "block";


    document.getElementById(
        "matchContent"
    ).innerHTML = `

        <div class="no-lvl">

            <div class="no-lvl-icon">
                🏆
            </div>

            <div class="no-lvl-title">
                NO ACTIVE LVL
            </div>

            <div class="no-lvl-text">
                There is currently no active
                LVL tournament.<br>
                Please check again later.
            </div>

        </div>

    `;


    document.getElementById(
        "formCard"
    ).style.display =
        "none";


    document.getElementById(
        "lvlNumber"
    ).textContent =
        "—";


    document.getElementById(
        "totalPlayers"
    ).textContent =
        "0";

}


/* ==================================================
   SHOW ERROR
================================================== */

function showError(message){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "matchContent"
    ).style.display =
        "block";


    document.getElementById(
        "matchContent"
    ).innerHTML = `

        <div class="no-lvl">

            <div class="no-lvl-icon">
                ⚠️
            </div>

            <div class="no-lvl-title">
                CONNECTION ERROR
            </div>

            <div class="no-lvl-text">
                ${message}
            </div>

        </div>

    `;

}


/* ==================================================
   UPDATE TOURNAMENT UI
================================================== */

function updateTournamentUI(
    data
){

    const t =
        data.tournament;


    document.getElementById(
        "ourScore"
    ).textContent =
        Number(
            data.ourScore || 0
        );


    document.getElementById(
        "opponentScore"
    ).textContent =
        Number(
            data.opponentScore || 0
        );


    document.getElementById(
        "opponentName"
    ).textContent =
        t.opponent ||
        "OPPONENT";


    document.getElementById(
        "lvlNumber"
    ).textContent =
        t.lvl ||
        "—";


    const submitted =
        Number(
            data.submitted || 0
        );


    const total =
        Number(
            data.total || 32
        );


    document.getElementById(
        "progressNumber"
    ).textContent =
        `${submitted} / ${total}`;


    document.getElementById(
        "totalPlayers"
    ).textContent =
        total;


    let percentage =
        0;


    if(total > 0){

        percentage =
            (
                submitted /
                total
            ) * 100;

    }


    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    /*
     * Save end time
     */

    tournament.endTime =
        t.endTime;


    startCountdown();

}


/* ==================================================
   COUNTDOWN
================================================== */

function startCountdown(){

    if(countdownTimer){

        clearInterval(
            countdownTimer
        );

    }


    updateCountdown();


    countdownTimer =
        setInterval(
            updateCountdown,
            1000
        );

}


/* ==================================================
   UPDATE COUNTDOWN
================================================== */

function updateCountdown(){

    if(
        !tournament ||
        !tournament.endTime
    ){

        return;

    }


    const countdown =
        document.getElementById(
            "countdown"
        );


    const end =
        new Date(
            tournament.endTime
        ).getTime();


    const now =
        Date.now();


    let remaining =
        end - now;


    if(remaining <= 0){

        countdown.textContent =
            "00:00:00";


        countdown.classList.remove(
            "warning"
        );


        countdown.classList.add(
            "danger"
        );


        return;

    }


    const totalSeconds =
        Math.floor(
            remaining / 1000
        );


    let hours =
        Math.floor(
            totalSeconds / 3600
        );


    let minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );


    let seconds =
        totalSeconds % 60;


    hours =
        String(hours)
            .padStart(2,"0");


    minutes =
        String(minutes)
            .padStart(2,"0");


    seconds =
        String(seconds)
            .padStart(2,"0");


    countdown.textContent =
        `${hours}:${minutes}:${seconds}`;


    countdown.classList.remove(
        "warning",
        "danger"
    );


    if(
        remaining <
        60 * 60 * 1000
    ){

        countdown.classList.add(
            "warning"
        );

    }


    if(
        remaining <
        15 * 60 * 1000
    ){

        countdown.classList.remove(
            "warning"
        );

        countdown.classList.add(
            "danger"
        );

    }

}


/* ==================================================
   POPULATE PLAYERS
================================================== */

function populatePlayers(
    playerRows
){

    const select =
        document.getElementById(
            "player"
        );


    select.innerHTML = "";


    const firstOption =
        document.createElement(
            "option"
        );


    firstOption.value = "";

    firstOption.textContent =
        "Choose player...";


    select.appendChild(
        firstOption
    );


    playerRows.forEach(
        function(row){

            /*
             * Backend returns:
             *
             * row.player.id
             * row.player.name
             *
             */

            const player =
                row.player || {};


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                row.playerId ||
                player.id;


            /*
             * IMPORTANT:
             * Use FC Name if available.
             */

            let name =
                player["FC Name"] ||
                player.name ||
                player["Player Name"] ||
                "Unknown Player";


            option.textContent =
                name;


            /*
             * If already submitted,
             * disable the player.
             */

            if(
                row.status ===
                "SUBMITTED"
            ){

                option.disabled =
                    true;

                option.textContent =
                    name +
                    " ✓";

            }


            select.appendChild(
                option
            );

        }
    );

}


/* ==================================================
   SUBMIT RESULT
================================================== */

async function submitResult(){

    const playerSelect =
        document.getElementById(
            "player"
        );


    const goalsInput =
        document.getElementById(
            "goals"
        );


    const button =
        document.getElementById(
            "submitBtn"
        );


    const status =
        document.getElementById(
            "status"
        );


    const playerId =
        playerSelect.value;


    const goals =
        goalsInput.value;


    status.className =
        "status";


    status.textContent =
        "";


    /*
     * Validate player
     */

    if(!playerId){

        status.textContent =
            "Please select your name.";

        status.classList.add(
            "error"
        );

        return;

    }


    /*
     * Validate goals
     */

    if(goals === ""){

        status.textContent =
            "Please enter the number of goals.";

        status.classList.add(
            "error"
        );

        return;

    }


    const numericGoals =
        Number(goals);


    if(
        !Number.isInteger(
            numericGoals
        ) ||
        numericGoals < 0
    ){

        status.textContent =
            "Goals must be a whole number greater than or equal to 0.";

        status.classList.add(
            "error"
        );

        return;

    }


    if(numericGoals > 99){

        status.textContent =
            "Goals cannot be greater than 99.";

        status.classList.add(
            "error"
        );

        return;

    }


    /*
     * Confirm
     */

    const selectedOption =
        playerSelect.options[
            playerSelect.selectedIndex
        ];


    const playerName =
        selectedOption.textContent
            .replace(
                " ✓",
                ""
            );


    const confirmed =
        confirm(
            `Submit ${numericGoals} goals for ${playerName}?`
        );


    if(!confirmed){

        return;

    }


    /*
     * Disable button
     */

    button.disabled =
        true;


    button.textContent =
        "SENDING...";


    try{

        /*
         * IMPORTANT:
         *
         * URL encoded POST
         * avoids unnecessary
         * CORS preflight.
         */

        const body =
            new URLSearchParams();


        body.append(
            "action",
            "submitResult"
        );


        body.append(
            "tournamentId",
            tournament.tournamentId
        );


        body.append(
            "playerId",
            playerId
        );


        body.append(
            "score",
            numericGoals
        );


        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded;charset=UTF-8"
                    },

                    body:
                        body.toString()

                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.error ||
                "Unable to submit result."
            );

        }


        /*
         * SUCCESS
         */

        status.textContent =
            `✓ Result submitted successfully — ${playerName}: ${numericGoals} goals`;

        status.classList.add(
            "success"
        );


        playerSelect.disabled =
            true;


        goalsInput.disabled =
            true;


        button.textContent =
            "✓ RESULT SUBMITTED";


        /*
         * Refresh data
         */

        setTimeout(
            refreshLVL,
            800
        );


    }catch(error){

        console.error(
            error
        );


        status.textContent =
            error.message ||
            "Something went wrong. Please try again.";

        status.classList.add(
            "error"
        );


        button.disabled =
            false;


        button.textContent =
            "⚡ SUBMIT RESULT";

    }

}


/* ==================================================
   REFRESH LVL
================================================== */

async function refreshLVL(){

    try{

        const data =
            await apiGet(
                "liveLVL"
            );


        if(
            !data ||
            !data.active
        ){

            showNoActiveLVL();

            return;

        }


        tournament =
            data.tournament;


        players =
            data.players || [];


        updateTournamentUI(
            data
        );


        /*
         * Preserve current player
         */

        const currentPlayer =
            document.getElementById(
                "player"
            ).value;


        populatePlayers(
            players
        );


        /*
         * If player already submitted,
         * disable form.
         */

        const playerRow =
            players.find(
                function(row){

                    return String(
                        row.playerId
                    ) ===
                    String(
                        currentPlayer
                    );

                }
            );


        if(
            playerRow &&
            playerRow.status ===
            "SUBMITTED"
        ){

            document.getElementById(
                "player"
            ).disabled =
                true;


            document.getElementById(
                "goals"
            ).disabled =
                true;


            document.getElementById(
                "submitBtn"
            ).disabled =
                true;


            document.getElementById(
                "submitBtn"
            ).textContent =
                "✓ RESULT SUBMITTED";

        }

    }catch(error){

        console.error(
            error
        );

    }

}


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    refreshLVL,
    30000
);


/* ==================================================
   START
================================================== */

loadLiveLVL();


</script>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Mobile • LVL</title>

<style>

:root{
    --bg:#050914;
    --bg2:#081226;
    --card:#0c172b;
    --card2:#101e36;
    --line:rgba(255,255,255,.08);

    --blue:#2487ff;
    --blue2:#00c6ff;
    --purple:#735cff;

    --green:#20e39a;
    --red:#ff4968;
    --yellow:#ffc857;

    --text:#ffffff;
    --muted:#8d9bb5;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(36,135,255,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 100% 40%,
            rgba(115,92,255,.10),
            transparent 30%
        ),

        var(--bg);

    padding-bottom:40px;
}

.container{
    width:100%;
    max-width:560px;

    margin:auto;

    padding:18px 14px 40px;
}


/* =========================================
   HEADER
========================================= */

.header{
    text-align:center;

    padding:12px 0 22px;
}

.logo{
    display:inline-flex;

    align-items:center;

    gap:8px;

    font-size:13px;

    font-weight:800;

    letter-spacing:3px;

    color:#a9cfff;

    text-transform:uppercase;
}

.logo-icon{
    width:28px;
    height:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    box-shadow:
        0 0 20px rgba(36,135,255,.4);
}

.header h1{
    margin-top:12px;

    font-size:38px;

    line-height:1;

    font-weight:900;

    letter-spacing:-1px;
}

.header p{
    margin-top:8px;

    font-size:12px;

    color:var(--muted);

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================================
   MATCH CARD
========================================= */

.match-card{
    position:relative;

    overflow:hidden;

    padding:24px 16px 20px;

    border:1px solid var(--line);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.01)
        ),

        var(--card);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.match-card::before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    left:50%;
    top:-150px;

    transform:translateX(-50%);

    background:
        rgba(36,135,255,.25);

    filter:blur(60px);
}


/* =========================================
   LIVE
========================================= */

.live{
    position:relative;

    display:flex;

    justify-content:center;

    margin-bottom:12px;
}

.live span{
    display:flex;

    align-items:center;

    gap:7px;

    padding:6px 12px;

    border-radius:30px;

    background:
        rgba(32,227,154,.08);

    border:
        1px solid rgba(32,227,154,.2);

    color:var(--green);

    font-size:10px;

    font-weight:800;

    letter-spacing:2px;
}

.live-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px var(--green);

    animation:
        pulse 1.4s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.4;
        transform:scale(.7);
    }

}


/* =========================================
   TEAMS
========================================= */

.teams{
    position:relative;

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:10px;

    margin-top:18px;
}

.team{
    text-align:center;
}

.team-name{
    font-size:13px;

    font-weight:800;

    color:#cbd6e8;

    text-transform:uppercase;

    line-height:1.3;

    word-break:break-word;
}

.team:first-child .team-name{
    color:#ffffff;
}

.team-logo{
    width:60px;
    height:60px;

    margin:
        0 auto 9px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #172a4a,
            #0b1528
        );

    border:
        1px solid rgba(255,255,255,.08);

    font-size:25px;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.05),

        0 10px 25px
        rgba(0,0,0,.25);
}

.score{
    font-size:42px;

    font-weight:900;

    letter-spacing:-2px;

    white-space:nowrap;
}

.score-separator{
    font-size:24px;

    color:#52617b;

    margin-top:-4px;
}


/* =========================================
   COUNTDOWN
========================================= */

.countdown-box{
    position:relative;

    margin-top:25px;

    padding:14px;

    border-radius:16px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid var(--line);

    text-align:center;
}

.countdown-label{
    font-size:9px;

    font-weight:800;

    letter-spacing:2px;

    color:var(--muted);

    text-transform:uppercase;
}

.countdown{
    margin-top:6px;

    font-size:25px;

    font-weight:900;

    letter-spacing:3px;

    font-variant-numeric:
        tabular-nums;
}

.countdown.warning{
    color:var(--yellow);
}

.countdown.danger{
    color:var(--red);
}


/* =========================================
   PROGRESS
========================================= */

.progress-section{
    margin-top:22px;
}

.progress-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;
}

.progress-title{
    font-size:11px;

    color:var(--muted);

    font-weight:700;

    letter-spacing:1px;
}

.progress-number{
    font-size:12px;

    font-weight:900;
}

.progress{
    height:8px;

    overflow:hidden;

    border-radius:20px;

    background:#17233a;
}

.progress-bar{
    width:0%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 0 14px
        rgba(36,135,255,.5);

    transition:.4s;
}


/* =========================================
   FORM
========================================= */

.form-card{
    margin-top:14px;

    padding:20px 16px;

    border-radius:22px;

    background:var(--card);

    border:
        1px solid var(--line);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.section-title{
    font-size:13px;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;

    margin-bottom:15px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;

    margin-bottom:7px;

    color:var(--muted);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

select,
input{
    width:100%;

    height:54px;

    padding:0 15px;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    background:#081327;

    color:white;

    font-size:15px;

    font-weight:700;

    transition:.2s;
}

select:focus,
input:focus{

    border-color:
        rgba(36,135,255,.7);

    box-shadow:
        0 0 0 3px
        rgba(36,135,255,.1);
}

select{
    appearance:auto;
}

input[type="number"]{

    text-align:center;

    font-size:24px;

    font-weight:900;
}


/* =========================================
   SUBMIT BUTTON
========================================= */

.submit-btn{
    width:100%;

    height:58px;

    border:0;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-size:13px;

    font-weight:900;

    letter-spacing:1.5px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    box-shadow:
        0 10px 30px
        rgba(36,135,255,.25);

    transition:.2s;
}

.submit-btn:hover{

    transform:
        translateY(-1px);

    box-shadow:
        0 14px 35px
        rgba(36,135,255,.35);
}

.submit-btn:active{

    transform:
        scale(.98);
}

.submit-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =========================================
   STATUS
========================================= */

.status{
    display:none;

    margin-top:14px;

    padding:13px 14px;

    border-radius:13px;

    font-size:12px;

    font-weight:700;

    line-height:1.4;
}

.status.success{

    display:block;

    color:var(--green);

    background:
        rgba(32,227,154,.08);

    border:
        1px solid
        rgba(32,227,154,.2);
}

.status.error{

    display:block;

    color:var(--red);

    background:
        rgba(255,73,104,.08);

    border:
        1px solid
        rgba(255,73,104,.2);
}


/* =========================================
   INFO
========================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:14px;
}

.info-card{

    padding:17px 14px;

    border-radius:18px;

    background:var(--card);

    border:
        1px solid var(--line);

    text-align:center;
}

.info-icon{

    font-size:20px;

    margin-bottom:8px;
}

.info-label{

    font-size:9px;

    color:var(--muted);

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;
}

.info-value{

    margin-top:5px;

    font-size:15px;

    font-weight:900;
}


/* =========================================
   FOOTER
========================================= */

.footer{

    text-align:center;

    margin-top:24px;

    color:#46536b;

    font-size:9px;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================================
   NO ACTIVE LVL
========================================= */

.no-lvl{

    text-align:center;

    padding:45px 20px;
}

.no-lvl-icon{

    font-size:45px;

    margin-bottom:15px;
}

.no-lvl-title{

    font-size:20px;

    font-weight:900;

    letter-spacing:1px;
}

.no-lvl-text{

    margin-top:8px;

    color:var(--muted);

    font-size:12px;

    line-height:1.5;
}


/* =========================================
   LOADING
========================================= */

.loading{

    text-align:center;

    padding:30px 10px;

    color:var(--muted);

    font-size:12px;

    letter-spacing:1px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:380px){

    .header h1{
        font-size:34px;
    }

    .score{
        font-size:36px;
    }

    .team-logo{
        width:52px;
        height:52px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     HEADER
======================================= -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            ⚡
        </div>

        FC MOBILE

    </div>


    <h1>

    </h1>

    </p>

<!-- ======================================

<section

<!-- ======================================

<section

    id="formCard"

    </div>



    <div
        id="formContent"

        <div class="field">

            <label for="player">

                <option value="">

        </div>

    </div>


</div>



<div class="footer">

</div>

<script>


/* ==================================================
   API
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby3nXVRE6Z1ZB4kQA4o037qJfwoeqhTq0YOwqxVoye4pAHbp1BuZustn9qmMx-E8d19/exec";


/* ==================================================
   VARIABLES
================================================== */

let tournament = null;

let players = [];

let countdownTimer = null;


/* ==================================================
   JSONP GET
================================================== */

function apiGet(action){

    return new Promise(function(resolve,reject){

        const callbackName =
            "jsonpCallback_" +
            Date.now() +
            "_" +
            Math.floor(
                Math.random() * 100000
            );


        const script =
            document.createElement("script");


        let completed = false;


        const timeout =
            setTimeout(function(){

                if(completed){
                    return;
                }


                completed =
                    true;


                cleanup();


                reject(
                    new Error(
                        "API request timed out."
                    )
                );

            },15000);


        window[callbackName] =
            function(response){

                if(completed){
                    return;
                }


                completed =
                    true;


                clearTimeout(
                    timeout
                );


                cleanup();


                resolve(
                    response
                );

            };


        function cleanup(){

            clearTimeout(
                timeout
            );


            delete window[
                callbackName
            ];


            if(
                script.parentNode
            ){

                script.parentNode.removeChild(
                    script
                );

            }

        }


        script.onerror =
            function(){

                if(completed){
                    return;
                }


                completed =
                    true;


                cleanup();


                reject(
                    new Error(
                        "Could not connect to API."
                    )
                );

            };


        script.src =
            API_URL +
            "?action=" +
            encodeURIComponent(
                action
            ) +
            "&callback=" +
            encodeURIComponent(
                callbackName
            ) +
            "&_=" +
            Date.now();


        document.body.appendChild(
            script
        );

    });

}


/* ==================================================
   LOAD CURRENT LVL
================================================== */

async function loadLiveLVL(){

    try{

        setLoading(
            "Checking current LVL..."
        );


        /*
         * First check ACTIVE tournament.
         *
         * This is the same endpoint used
         * by the working admin page.
         */

        const activeResponse =
            await apiGet(
                "activeTournament"
            );


        if(
            !activeResponse ||
            !activeResponse.success ||
            !activeResponse.data
        ){

            showNoActiveLVL();

            return;

        }


        /*
         * We have an ACTIVE tournament.
         */

        const activeTournament =
            activeResponse.data;


        /*
         * Now get live LVL information.
         */

        const liveResponse =
            await apiGet(
                "liveLVL"
            );


        if(
            liveResponse &&
            liveResponse.success &&
            liveResponse.data &&
            liveResponse.data.active
        ){

            tournament =
                normalizeTournament(
                    liveResponse.data.tournament
                );


            players =
                liveResponse.data.players || [];


            updateTournamentUI(
                liveResponse.data
            );


            populatePlayers(
                players
            );

        }else{

            /*
             * Fallback:
             * use activeTournament directly.
             */

            tournament =
                normalizeTournament(
                    activeTournament
                );


            updateTournamentFromActive(
                tournament
            );


            /*
             * Try loading player list separately.
             */

            try{

                const playerResponse =
                    await apiGet(
                        "players"
                    );


                if(
                    playerResponse &&
                    playerResponse.success
                ){

                    players =
                        playerResponse.data || [];


                    populateSimplePlayers(
                        players
                    );

                }

            }catch(playerError){

                console.log(
                    "Player loading failed:",
                    playerError
                );

            }

        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "matchContent"
        ).style.display =
            "block";


        document.getElementById(
            "formCard"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            "LVL loading error:",
            error
        );


        showError(
            "Unable to connect to the LVL system. Please try again."
        );

    }

}


/* ==================================================
   NORMALIZE TOURNAMENT
================================================== */

function normalizeTournament(t){

    if(!t){
        return null;
    }


    return {

        tournamentId:
            t.tournamentId ||
            t["Tournament ID"] ||
            t.id ||
            "",


        lvl:
            t.lvl ||
            t["LVL"] ||
            "—",


        opponent:
            t.opponent ||
            t["Opponent"] ||
            "OPPONENT",


        startTime:
            t.startTime ||
            t["Start Time"] ||
            "",


        endTime:
            t.endTime ||
            t["End Time"] ||
            "",


        ourScore:
            Number(
                t.ourScore ??
                t["Our Score"] ??
                0
            ),


        opponentScore:
            Number(
                t.opponentScore ??
                t["Opponent Score"] ??
                0
            )

    };

}


/* ==================================================
   UPDATE FROM ACTIVE TOURNAMENT
================================================== */

function updateTournamentFromActive(t){

    document.getElementById(
        "ourScore"
    ).textContent =
        Number(
            t.ourScore || 0
        );


    document.getElementById(
        "opponentScore"
    ).textContent =
        Number(
            t.opponentScore || 0
        );


    document.getElementById(
        "opponentName"
    ).textContent =
        t.opponent ||
        "OPPONENT";


    document.getElementById(
        "lvlNumber"
    ).textContent =
        t.lvl ||
        "—";


    document.getElementById(
        "progressNumber"
    ).textContent =
        "0 / 32";


    document.getElementById(
        "progressBar"
    ).style.width =
        "0%";


    document.getElementById(
        "totalPlayers"
    ).textContent =
        "32";


    startCountdown();

}


/* ==================================================
   UPDATE TOURNAMENT UI
================================================== */

function updateTournamentUI(data){

    const t =
        normalizeTournament(
            data.tournament
        );


    tournament =
        t;


    document.getElementById(
        "ourScore"
    ).textContent =
        Number(
            data.ourScore ??
            t.ourScore ??
            0
        );


    document.getElementById(
        "opponentScore"
    ).textContent =
        Number(
            data.opponentScore ??
            t.opponentScore ??
            0
        );


    document.getElementById(
        "opponentName"
    ).textContent =
        t.opponent ||
        "OPPONENT";


    document.getElementById(
        "lvlNumber"
    ).textContent =
        t.lvl ||
        "—";


    const submitted =
        Number(
            data.submitted || 0
        );


    const total =
        Number(
            data.total || 32
        );


    document.getElementById(
        "progressNumber"
    ).textContent =
        submitted +
        " / " +
        total;


    document.getElementById(
        "totalPlayers"
    ).textContent =
        total;


    const percentage =
        total > 0
        ? (
            submitted /
            total
        ) * 100
        : 0;


    document.getElementById(
        "progressBar"
    ).style.width =
        percentage +
        "%";


    startCountdown();

}


/* ==================================================
   SIMPLE PLAYERS
================================================== */

function populateSimplePlayers(
    playerRows
){

    const select =
        document.getElementById(
            "player"
        );


    select.innerHTML =
        "";


    const first =
        document.createElement(
            "option"
        );


    first.value =
        "";


    first.textContent =
        "Choose player...";


    select.appendChild(
        first
    );


    playerRows.forEach(
        function(player){

            const id =
                player["Player ID"] ||
                player.id ||
                player["ID"];


            const name =
                player["FC Name"] ||
                player.name ||
                player["Player Name"] ||
                "Unknown Player";


            if(!id){
                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                id;


            option.textContent =
                name;


            select.appendChild(
                option
            );

        }
    );

}


/* ==================================================
   PLAYERS FROM LIVE LVL
================================================== */

function populatePlayers(
    playerRows
){

    const select =
        document.getElementById(
            "player"
        );


    select.innerHTML =
        "";


    const first =
        document.createElement(
            "option"
        );


    first.value =
        "";


    first.textContent =
        "Choose player...";


    select.appendChild(
        first
    );


    playerRows.forEach(
        function(row){

            const player =
                row.player || {};


            const id =
                row.playerId ||
                player["Player ID"] ||
                player.id;


            const name =
                player["FC Name"] ||
                player.name ||
                player["Player Name"] ||
                "Unknown Player";


            if(!id){
                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                id;


            option.textContent =
                name;


            if(
                row.status ===
                "SUBMITTED"
            ){

                option.disabled =
                    true;


                option.textContent =
                    name +
                    " ✓";

            }


            select.appendChild(
                option
            );

        }
    );

}


/* ==================================================
   COUNTDOWN
================================================== */

function startCountdown(){

    if(countdownTimer){

        clearInterval(
            countdownTimer
        );

    }


    updateCountdown();


    countdownTimer =
        setInterval(
            updateCountdown,
            1000
        );

}


/* ==================================================
   UPDATE COUNTDOWN
================================================== */

function updateCountdown(){

    if(
        !tournament ||
        !tournament.endTime
    ){

        return;

    }


    const countdown =
        document.getElementById(
            "countdown"
        );


    const end =
        new Date(
            tournament.endTime
        ).getTime();


    const now =
        Date.now();


    const remaining =
        end - now;


    if(remaining <= 0){

        countdown.textContent =
            "00:00:00";


        countdown.classList.remove(
            "warning"
        );


        countdown.classList.add(
            "danger"
        );


        return;

    }


    const totalSeconds =
        Math.floor(
            remaining / 1000
        );


    let hours =
        Math.floor(
            totalSeconds / 3600
        );


    let minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );


    let seconds =
        totalSeconds % 60;


    hours =
        String(hours).padStart(
            2,
            "0"
        );


    minutes =
        String(minutes).padStart(
            2,
            "0"
        );


    seconds =
        String(seconds).padStart(
            2,
            "0"
        );


    countdown.textContent =
        hours +
        ":" +
        minutes +
        ":" +
        seconds;


    countdown.classList.remove(
        "warning",
        "danger"
    );


    if(
        remaining <
        60 * 60 * 1000
    ){

        countdown.classList.add(
            "warning"
        );

    }


    if(
        remaining <
        15 * 60 * 1000
    ){

        countdown.classList.remove(
            "warning"
        );


        countdown.classList.add(
            "danger"
        );

    }

}

/* ==================================================
   SUBMIT RESULT
================================================== */

async function submitResult(){

    const playerSelect =
        document.getElementById(
            "player"
        );


    const goalsInput =
        document.getElementById(
            "goals"
        );


    const button =
        document.getElementById(
            "submitBtn"
        );


    const status =
        document.getElementById(
            "status"
        );


    const playerId =
        playerSelect.value;


    const goals =
        goalsInput.value;


    status.className =
        "status";


    status.textContent =
        "";


    if(!playerId){

        status.textContent =
            "Please select your name.";


        status.classList.add(
            "error"
        );


        return;

    }


    if(goals === ""){

        status.textContent =
            "Please enter the number of goals.";


        status.classList.add(
            "error"
        );


        return;

    }


    const numericGoals =
        Number(
            goals
        );


    if(
        !Number.isInteger(
            numericGoals
        ) ||
        numericGoals < 0 ||
        numericGoals > 99
    ){

        status.textContent =
            "Please enter a valid goal number.";


        status.classList.add(
            "error"
        );


        return;

    }


    const selectedOption =
        playerSelect.options[
            playerSelect.selectedIndex
        ];


    const playerName =
        selectedOption.textContent
            .replace(
                " ✓",
                ""
            );


    if(
        !confirm(
            `Submit ${numericGoals} goals for ${playerName}?`
        )
    ){

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "SENDING...";


    try{

        const body =
            new URLSearchParams();


        body.append(
            "action",
            "submitResult"
        );


        body.append(
            "tournamentId",
            tournament.tournamentId
        );


        body.append(
            "playerId",
            playerId
        );


        body.append(
            "score",
            numericGoals
        );


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded;charset=UTF-8"
                    },

                    body:
                        body.toString()

                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){

            throw new Error(
                data.error ||
                "Unable to submit result."
            );

        }


        status.textContent =
            `✓ Result submitted successfully — ${playerName}: ${numericGoals} goals`;


        status.classList.add(
            "success"
        );


        playerSelect.disabled =
            true;


        goalsInput.disabled =
            true;


        button.textContent =
            "✓ RESULT SUBMITTED";


        setTimeout(
            refreshLVL,
            800
        );


    }catch(error){

        console.error(
            "Submit error:",
            error
        );


        status.textContent =
            error.message ||
            "Something went wrong. Please try again.";


        status.classList.add(
            "error"
        );


        button.disabled =
            false;


        button.textContent =
            "⚡ SUBMIT RESULT";

    }

}


/* ==================================================
   REFRESH LVL
================================================== */

async function refreshLVL(){

    try{

        const liveResponse =
            await apiGet(
                "liveLVL"
            );


        if(
            liveResponse &&
            liveResponse.success &&
            liveResponse.data &&
            liveResponse.data.active
        ){

            const currentPlayer =
                document.getElementById(
                    "player"
                ).value;


            tournament =
                normalizeTournament(
                    liveResponse.data.tournament
                );


            players =
                liveResponse.data.players || [];


            updateTournamentUI(
                liveResponse.data
            );


            populatePlayers(
                players
            );


            const playerSelect =
                document.getElementById(
                    "player"
                );


            if(currentPlayer){

                const option =
                    Array.from(
                        playerSelect.options
                    ).find(
                        function(option){

                            return option.value ===
                                currentPlayer;

                        }
                    );


                if(option){

                    playerSelect.value =
                        currentPlayer;

                }

            }


            return;

        }


        /*
         * If liveLVL says there is no active LVL,
         * verify with activeTournament.
         */

        const activeResponse =
            await apiGet(
                "activeTournament"
            );


        if(
            activeResponse &&
            activeResponse.success &&
            activeResponse.data
        ){

            tournament =
                normalizeTournament(
                    activeResponse.data
                );


            updateTournamentFromActive(
                tournament
            );


            return;

        }


        showNoActiveLVL();


    }catch(error){

        console.error(
            "Refresh error:",
            error
        );

    }

}


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    refreshLVL,
    30000
);

loadLiveLVL();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Mobile • LVL</title>

<style>

:root{
    --bg:#050914;
    --bg2:#081226;
    --card:#0c172b;
    --card2:#101e36;
    --line:rgba(255,255,255,.08);

    --blue:#2487ff;
    --blue2:#00c6ff;
    --purple:#735cff;

    --green:#20e39a;
    --red:#ff4968;
    --yellow:#ffc857;

    --text:#ffffff;
    --muted:#8d9bb5;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at 50% -10%,rgba(36,135,255,.25),transparent 35%),
        radial-gradient(circle at 100% 40%,rgba(115,92,255,.10),transparent 30%),
        var(--bg);

    padding-bottom:40px;
}

.container{
    width:100%;
    max-width:560px;
    margin:auto;
    padding:18px 14px 40px;
}

/* HEADER */

.header{
    text-align:center;
    padding:12px 0 22px;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:8px;

    font-size:13px;
    font-weight:800;
    letter-spacing:3px;

    color:#a9cfff;
    text-transform:uppercase;
}

.logo-icon{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:linear-gradient(135deg,var(--blue),var(--purple));

    box-shadow:
        0 0 20px rgba(36,135,255,.4);
}

.header h1{
    margin-top:12px;

    font-size:38px;
    line-height:1;

    font-weight:900;
    letter-spacing:-1px;
}

.header p{
    margin-top:8px;

    font-size:12px;
    color:var(--muted);

    letter-spacing:2px;
    text-transform:uppercase;
}

/* MAIN MATCH CARD */

.match-card{
    position:relative;
    overflow:hidden;

    padding:24px 16px 20px;

    border:1px solid var(--line);
    border-radius:24px;

    background:
        linear-gradient(145deg,
        rgba(255,255,255,.04),
        rgba(255,255,255,.01)),
        var(--card);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.match-card::before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    left:50%;
    top:-150px;

    transform:translateX(-50%);

    background:rgba(36,135,255,.25);

    filter:blur(60px);
}

/* LIVE BADGE */

.live{
    position:relative;

    display:flex;
    justify-content:center;
    margin-bottom:12px;
}

.live span{
    display:flex;
    align-items:center;
    gap:7px;

    padding:6px 12px;

    border-radius:30px;

    background:rgba(32,227,154,.08);
    border:1px solid rgba(32,227,154,.2);

    color:var(--green);

    font-size:10px;
    font-weight:800;

    letter-spacing:2px;
}

.live-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 10px var(--green);

    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.4;
        transform:scale(.7);
    }
}

/* TEAMS */

.teams{
    position:relative;

    display:grid;
    grid-template-columns:1fr auto 1fr;

    align-items:center;

    gap:10px;

    margin-top:18px;
}

.team{
    text-align:center;
}

.team-name{
    font-size:13px;
    font-weight:800;

    color:#cbd6e8;

    text-transform:uppercase;

    line-height:1.3;
}

.team:first-child .team-name{
    color:#ffffff;
}

.team-logo{
    width:60px;
    height:60px;

    margin:0 auto 9px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:linear-gradient(
        145deg,
        #172a4a,
        #0b1528
    );

    border:1px solid rgba(255,255,255,.08);

    font-size:25px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 25px rgba(0,0,0,.25);
}

.score{
    font-size:42px;
    font-weight:900;

    letter-spacing:-2px;
}

.score-separator{
    font-size:24px;
    color:#52617b;
    margin-top:-4px;
}

/* COUNTDOWN */

.countdown-box{
    position:relative;

    margin-top:25px;

    padding:14px;

    border-radius:16px;

    background:rgba(255,255,255,.025);

    border:1px solid var(--line);

    text-align:center;
}

.countdown-label{
    font-size:9px;
    font-weight:800;

    letter-spacing:2px;

    color:var(--muted);

    text-transform:uppercase;
}

.countdown{
    margin-top:6px;

    font-size:25px;
    font-weight:900;

    letter-spacing:3px;

    font-variant-numeric:tabular-nums;
}

.countdown.warning{
    color:var(--yellow);
}

.countdown.danger{
    color:var(--red);
}

/* PROGRESS */

.progress-section{
    margin-top:22px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;
}

.progress-title{
    font-size:11px;

    color:var(--muted);

    font-weight:700;

    letter-spacing:1px;
}

.progress-number{
    font-size:12px;
    font-weight:900;
}

.progress{
    height:8px;

    overflow:hidden;

    border-radius:20px;

    background:#17233a;
}

.progress-bar{
    width:0%;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--blue2)
        );

    box-shadow:
        0 0 14px rgba(36,135,255,.5);

    transition:.4s;
}

/* FORM CARD */

.form-card{
    margin-top:14px;

    padding:20px 16px;

    border-radius:22px;

    background:var(--card);

    border:1px solid var(--line);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);
}

.section-title{
    font-size:13px;
    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;

    margin-bottom:15px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;

    margin-bottom:7px;

    color:var(--muted);

    font-size:10px;
    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

select,
input{
    width:100%;

    height:54px;

    padding:0 15px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.08);

    outline:none;

    background:#081327;

    color:white;

    font-size:15px;
    font-weight:700;

    transition:.2s;
}

select:focus,
input:focus{
    border-color:rgba(36,135,255,.7);

    box-shadow:
        0 0 0 3px rgba(36,135,255,.1);
}

select{
    appearance:auto;
}

input[type="number"]{
    text-align:center;

    font-size:24px;

    font-weight:900;
}

/* SUBMIT */

.submit-btn{
    width:100%;

    height:58px;

    border:0;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-size:13px;
    font-weight:900;

    letter-spacing:1.5px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    box-shadow:
        0 10px 30px rgba(36,135,255,.25);

    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 14px 35px rgba(36,135,255,.35);
}

.submit-btn:active{
    transform:scale(.98);
}

.submit-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* STATUS */

.status{
    display:none;

    margin-top:14px;

    padding:13px 14px;

    border-radius:13px;

    font-size:12px;

    font-weight:700;

    line-height:1.4;
}

.status.success{
    display:block;

    color:var(--green);

    background:rgba(32,227,154,.08);

    border:1px solid rgba(32,227,154,.2);
}

.status.error{
    display:block;

    color:var(--red);

    background:rgba(255,73,104,.08);

    border:1px solid rgba(255,73,104,.2);
}

/* INFO CARDS */

.info-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:14px;
}

.info-card{
    padding:17px 14px;

    border-radius:18px;

    background:var(--card);

    border:1px solid var(--line);

    text-align:center;
}

.info-icon{
    font-size:20px;

    margin-bottom:8px;
}

.info-label{
    font-size:9px;

    color:var(--muted);

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;
}

.info-value{
    margin-top:5px;

    font-size:15px;

    font-weight:900;
}

/* FOOTER */

.footer{
    text-align:center;

    margin-top:24px;

    color:#46536b;

    font-size:9px;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* NO ACTIVE LVL */

.no-lvl{
    text-align:center;
    padding:25px 10px;
}

.no-lvl-icon{
    font-size:35px;
    margin-bottom:12px;
}

.no-lvl-title{
    font-size:17px;
    font-weight:900;
}

.no-lvl-text{
    margin-top:7px;
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
}

/* MOBILE */

@media(max-width:380px){

    .header h1{
        font-size:34px;
    }

    .score{
        font-size:36px;
    }

    .team-logo{
        width:52px;
        height:52px;
    }

}

</style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <div class="logo-icon">⚡</div>
            FC MOBILE
        </div>

        <h1>LVL TOURNAMENT</h1>

        <p>Daily competition</p>

    </header>


    <!-- MATCH -->

    <section class="match-card">

        <div class="live">

            <span>
                <i class="live-dot"></i>
                <span id="liveText">LIVE</span>
            </span>

        </div>


        <div class="teams">

            <div class="team">

                <div class="team-logo">
                    ⚡
                </div>

                <div
                    class="team-name"
                    id="teamName"
                >
                    YOUR TEAM
                </div>

            </div>


            <div>

                <div class="score">

                    <span id="ourScore">0</span>

                    <span class="score-separator">:</span>

                    <span id="opponentScore">0</span>

                </div>

            </div>


            <div class="team">

                <div class="team-logo">
                    🛡️
                </div>

                <div
                    class="team-name"
                    id="opponentName"
                >
                    OPPONENT
                </div>

            </div>

        </div>


        <!-- COUNTDOWN -->

        <div class="countdown-box">

            <div class="countdown-label">
                Time remaining
            </div>

            <div
                class="countdown"
                id="countdown"
            >
                --:--:--
            </div>

        </div>


        <!-- PROGRESS -->

        <div class="progress-section">

            <div class="progress-top">

                <div class="progress-title">
                    PLAYER SUBMISSIONS
                </div>

                <div
                    class="progress-number"
                    id="progressNumber"
                >
                    0 / 32
                </div>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>

    </section>


    <!-- SUBMIT FORM -->

    <section class="form-card">

        <div class="section-title">
            ⚽ Submit your result
        </div>


        <div class="field">

            <label for="player">
                Select your name
            </label>

            <select id="player">

                <option value="">
                    Choose player...
                </option>

            </select>

        </div>


        <div class="field">

            <label for="goals">
                Your goals
            </label>

            <input
                type="number"
                id="goals"
                min="0"
                max="99"
                placeholder="0"
            >

        </div>


        <button
            class="submit-btn"
            id="submitBtn"
            onclick="submitResult()"
        >
            ⚡ SUBMIT RESULT
        </button>


        <div
            class="status"
            id="status"
        ></div>

    </section>


    <!-- INFO -->

    <div class="info-grid">

        <div class="info-card">

            <div class="info-icon">
                🏆
            </div>

            <div class="info-label">
                LVL
            </div>

            <div
                class="info-value"
                id="lvlNumber"
            >
                -
            </div>

        </div>


        <div class="info-card">

            <div class="info-icon">
                👥
            </div>

            <div class="info-label">
                Players
            </div>

            <div
                class="info-value"
                id="playerCount"
            >
                0
            </div>

        </div>

    </div>


    <div class="footer">
        FC MOBILE • LVL SYSTEM
    </div>

</div>


<script>

/* ==================================================
   FC MOBILE LVL FRONTEND
   GOOGLE APPS SCRIPT API
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby3nXVRE6Z1ZB4kQA4o037qJfwoeqhTq0YOwqxVoye4pAHbp1BuZustn9qmMx-E8d19/exec";


let tournament = {
    active:false,
    lvl:0,
    opponent:"",
    ourScore:0,
    opponentScore:0,
    submitted:0,
    total:32,
    endTime:null
};


let players = [];


/* ==================================================
   API GET
================================================== */

async function apiGet(action){

    const url =
        API_URL +
        "?action=" +
        encodeURIComponent(action);

    const response =
        await fetch(url, {
            method:"GET",
            cache:"no-store"
        });

    if(!response.ok){
        throw new Error(
            "API request failed: " +
            response.status
        );
    }

    const data =
        await response.json();

    if(data.success === false){
        throw new Error(
            data.error ||
            "API error"
        );
    }

    return data;
}


/* ==================================================
   API POST
================================================== */

async function apiPost(action, values){

    const body =
        new URLSearchParams();

    body.append(
        "action",
        action
    );

    Object.keys(values).forEach(function(key){

        body.append(
            key,
            values[key]
        );

    });


    const response =
        await fetch(API_URL, {
            method:"POST",

            headers:{
                "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
            },

            body:body.toString()
        });


    if(!response.ok){
        throw new Error(
            "API request failed: " +
            response.status
        );
    }


    const data =
        await response.json();


    if(data.success === false){
        throw new Error(
            data.error ||
            "API error"
        );
    }


    return data;
}


/* ==================================================
   SHOW STATUS
================================================== */

function showStatus(message, type){

    const status =
        document.getElementById("status");

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* ==================================================
   LOAD LIVE LVL
================================================== */

async function loadLiveLVL(){

    try{

        const result =
            await apiGet("liveLVL");

        const data =
            result.data;


        if(!data || !data.active){

            tournament.active =
                false;

            players = [];

            updateTournamentUI();

            populatePlayers();

            return;

        }


        tournament.active =
            true;


        const t =
            data.tournament || {};


        tournament.lvl =
            Number(t.lvl || 0);


        tournament.opponent =
            t.opponent ||
            "OPPONENT";


        tournament.ourScore =
            Number(
                data.ourScore ??
                t.ourScore ??
                0
            );


        tournament.opponentScore =
            Number(
                data.opponentScore ??
                t.opponentScore ??
                0
            );


        tournament.submitted =
            Number(
                data.submitted ||
                0
            );


        tournament.total =
            Number(
                data.total ||
                32
            );


        tournament.endTime =
            parseDate(
                t.endTime ||
                t.end_time ||
                t.endTimeISO
            );


        players =
            Array.isArray(data.players)
                ? data.players
                : [];


        updateTournamentUI();

        populatePlayers();


    }catch(error){

        console.error(
            "loadLiveLVL:",
            error
        );


        showStatus(
            "Unable to load the current LVL. Please try again.",
            "error"
        );

    }

}


/* ==================================================
   PARSE DATE
================================================== */

function parseDate(value){

    if(!value){
        return null;
    }


    if(value instanceof Date){
        return value;
    }


    const date =
        new Date(value);


    if(!isNaN(date.getTime())){
        return date;
    }


    return null;

}


/* ==================================================
   UPDATE TOURNAMENT UI
================================================== */

function updateTournamentUI(){

    const ourScore =
        document.getElementById("ourScore");

    const opponentScore =
        document.getElementById("opponentScore");

    const opponentName =
        document.getElementById("opponentName");

    const lvlNumber =
        document.getElementById("lvlNumber");

    const progressNumber =
        document.getElementById("progressNumber");

    const progressBar =
        document.getElementById("progressBar");

    const playerCount =
        document.getElementById("playerCount");

    const liveText =
        document.getElementById("liveText");

    const submitBtn =
        document.getElementById("submitBtn");


    if(!tournament.active){

        ourScore.textContent =
            "0";

        opponentScore.textContent =
            "0";

        opponentName.textContent =
            "NO OPPONENT";

        lvlNumber.textContent =
            "-";

        progressNumber.textContent =
            "0 / 0";

        progressBar.style.width =
            "0%";

        playerCount.textContent =
            "0";

        liveText.textContent =
            "NO ACTIVE LVL";

        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "NO ACTIVE LVL";

        return;

    }


    ourScore.textContent =
        tournament.ourScore;


    opponentScore.textContent =
        tournament.opponentScore;


    opponentName.textContent =
        tournament.opponent;


    lvlNumber.textContent =
        tournament.lvl;


    progressNumber.textContent =
        `${tournament.submitted} / ${tournament.total}`;


    const percentage =
        tournament.total > 0
            ? (
                tournament.submitted /
                tournament.total
              ) * 100
            : 0;


    progressBar.style.width =
        Math.min(
            100,
            Math.max(
                0,
                percentage
            )
        ) + "%";


    playerCount.textContent =
        tournament.total;


    liveText.textContent =
        "LIVE";


    submitBtn.disabled =
        false;


    submitBtn.textContent =
        "⚡ SUBMIT RESULT";

}


/* ==================================================
   POPULATE PLAYER SELECT
================================================== */

function populatePlayers(){

    const select =
        document.getElementById("player");


    const previousValue =
        select.value;


    select.innerHTML = "";


    const firstOption =
        document.createElement("option");


    firstOption.value =
        "";

    firstOption.textContent =
        tournament.active
            ? "Choose player..."
            : "No active LVL";


    select.appendChild(
        firstOption
    );


    if(!tournament.active){
        return;
    }


    players.forEach(function(item){

        const option =
            document.createElement("option");


        /*
         The Apps Script returns:
         playerId
         player
         status
         score
        */

        const playerId =
            item.playerId ||
            item.id ||
            "";


        const playerObject =
            item.player ||
            {};


        const playerName =
            playerObject.name ||
            playerObject.Name ||
            item.playerName ||
            item.name ||
            item.Name ||
            playerId;


        option.value =
            playerId;


        option.textContent =
            playerName;


        /*
         Already submitted players are disabled.
        */

        const status =
            String(
                item.status || ""
            ).toUpperCase();


        if(
            status === "SUBMITTED" ||
            (
                item.score !== null &&
                item.score !== undefined &&
                item.score !== ""
            )
        ){

            option.disabled =
                true;

            option.textContent =
                playerName +
                " ✓";

        }


        select.appendChild(
            option
        );

    });


    /*
    Restore previous selection
    if it still exists.
    */

    if(previousValue){

        const exists =
            Array.from(
                select.options
            ).some(function(option){

                return (
                    option.value ===
                    previousValue
                );

            });


        if(exists){
            select.value =
                previousValue;
        }

    }

}


/* ==================================================
   SUBMIT RESULT
================================================== */

async function submitResult(){

    const select =
        document.getElementById("player");

    const goalsInput =
        document.getElementById("goals");

    const button =
        document.getElementById("submitBtn");


    const playerId =
        select.value;


    const goals =
        goalsInput.value;


    if(!tournament.active){

        showStatus(
            "There is no active LVL tournament.",
            "error"
        );

        return;

    }


    if(!playerId){

        showStatus(
            "Please select your name.",
            "error"
        );

        return;

    }


    if(goals === ""){

        showStatus(
            "Please enter the number of goals.",
            "error"
        );

        return;

    }


    const score =
        Number(goals);


    if(
        !Number.isInteger(score) ||
        score < 0 ||
        score > 99
    ){

        showStatus(
            "Goals must be a whole number between 0 and 99.",
            "error"
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "SENDING...";


    try{

        /*
        Send the PLAYER ID,
        not the displayed name.
        */

        const result =
            await apiPost(
                "submitResult",
                {
                    tournamentId:
                        tournamentId(),

                    playerId:
                        playerId,

                    score:
                        score
                }
            );


        showStatus(
            "✓ Result submitted successfully!",
            "success"
        );


        select.disabled =
            true;

        goalsInput.disabled =
            true;


        button.textContent =
            "✓ RESULT SUBMITTED";


        /*
        Reload data from Google Sheets.
        */

        await loadLiveLVL();


        /*
        Keep form locked for this browser session
        after successful submission.
        */

        select.disabled =
            true;

        goalsInput.disabled =
            true;

        button.disabled =
            true;

        button.textContent =
            "✓ RESULT SUBMITTED";


    }catch(error){

        console.error(
            "submitResult:",
            error
        );


        showStatus(
            error.message ||
            "Unable to submit result.",
            "error"
        );


        button.disabled =
            false;

        button.textContent =
            "⚡ SUBMIT RESULT";

    }

}


/* ==================================================
   GET CURRENT TOURNAMENT ID
================================================== */

function tournamentId(){

    if(!tournament.active){
        return "";
    }


    /*
    liveLVL response normally contains
    the tournament object with an ID.
    */

    if(
        tournament.id
    ){
        return tournament.id;
    }


    /*
    If the ID was stored separately.
    */

    return (
        tournament.tournamentId ||
        window.currentTournamentId ||
        ""
    );

}


/* ==================================================
   SAVE TOURNAMENT ID
================================================== */

function setTournamentIdFromData(data){

    if(!data){
        return;
    }


    const t =
        data.tournament ||
        {};


    const id =
        t.tournamentId ||
        t.id ||
        t.ID ||
        t.tournamentID ||
        "";


    if(id){

        tournament.id =
            id;

        tournament.tournamentId =
            id;

        window.currentTournamentId =
            id;

    }

}


/* ==================================================
   UPDATED LOAD FUNCTION
================================================== */

const originalLoadLiveLVL =
    loadLiveLVL;


/*
We wrap the loader so the tournament ID
is also stored.
*/

loadLiveLVL = async function(){

    try{

        const result =
            await apiGet("liveLVL");

        const data =
            result.data;


        if(!data || !data.active){

            tournament.active =
                false;

            players = [];

            updateTournamentUI();

            populatePlayers();

            return;

        }


        tournament.active =
            true;


        setTournamentIdFromData(
            data
        );


        const t =
            data.tournament || {};


        tournament.id =
            t.tournamentId ||
            t.id ||
            t.ID ||
            tournament.id ||
            "";


        tournament.tournamentId =
            tournament.id;


        tournament.lvl =
            Number(
                t.lvl || 0
            );


        tournament.opponent =
            t.opponent ||
            "OPPONENT";


        tournament.ourScore =
            Number(
                data.ourScore ??
                t.ourScore ??
                0
            );


        tournament.opponentScore =
            Number(
                data.opponentScore ??
                t.opponentScore ??
                0
            );


        tournament.submitted =
            Number(
                data.submitted ||
                0
            );


        tournament.total =
            Number(
                data.total ||
                32
            );


        tournament.endTime =
            parseDate(
                t.endTime ||
                t.end_time ||
                t.endTimeISO
            );


        players =
            Array.isArray(
                data.players
            )
                ? data.players
                : [];


        updateTournamentUI();

        populatePlayers();


    }catch(error){

        console.error(
            "loadLiveLVL:",
            error
        );


        showStatus(
            "Unable to load the current LVL. Please try again.",
            "error"
        );

    }

};


/* ==================================================
   COUNTDOWN
================================================== */

function updateCountdown(){

    const countdown =
        document.getElementById("countdown");


    if(
        !tournament.active ||
        !tournament.endTime
    ){

        countdown.textContent =
            "--:--:--";

        countdown.classList.remove(
            "warning",
            "danger"
        );

        return;

    }


    let remaining =
        tournament.endTime.getTime() -
        Date.now();


    if(remaining <= 0){

        countdown.textContent =
            "00:00:00";

        countdown.classList.remove(
            "warning"
        );

        countdown.classList.add(
            "danger"
        );

        return;

    }


    let totalSeconds =
        Math.floor(
            remaining / 1000
        );


    let days =
        Math.floor(
            totalSeconds / 86400
        );


    let hours =
        Math.floor(
            (totalSeconds % 86400) /
            3600
        );


    let minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );


    let seconds =
        totalSeconds % 60;


    let displayHours =
        days * 24 + hours;


    const h =
        String(
            displayHours
        ).padStart(
            2,
            "0"
        );


    const m =
        String(
            minutes
        ).padStart(
            2,
            "0"
        );


    const s =
        String(
            seconds
        ).padStart(
            2,
            "0"
        );


    countdown.textContent =
        `${h}:${m}:${s}`;


    countdown.classList.remove(
        "warning",
        "danger"
    );


    if(
        remaining <
        60 * 60 * 1000
    ){

        countdown.classList.add(
            "warning"
        );

    }


    if(
        remaining <
        15 * 60 * 1000
    ){

        countdown.classList.remove(
            "warning"
        );

        countdown.classList.add(
            "danger"
        );

    }

}


setInterval(
    updateCountdown,
    1000
);


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    async function(){

        /*
        Don't refresh while user is actively
        typing a result.
        */

        const goals =
            document.getElementById("goals");


        if(
            document.activeElement ===
            goals
        ){
            return;
        }


        await loadLiveLVL();

    },
    30000
);


/* ==================================================
   INITIAL LOAD
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        /*
        Initial UI
        */

        updateTournamentUI();

        updateCountdown();


        /*
        Load real data
        */

        await loadLiveLVL();

        updateCountdown();

    }
);

</script>

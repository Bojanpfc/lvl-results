<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Mobile • LVL Admin</title>

<style>
:root{
    --bg:#050b18;
    --card:#0c1730;
    --card2:#101f3e;
    --line:#1d3157;
    --text:#f4f7ff;
    --muted:#8ea4c7;
    --blue:#2490ff;
    --green:#21d68b;
    --red:#ff4d67;
    --yellow:#ffc857;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#102653 0%,#050b18 45%,#030711 100%);
    color:var(--text);
    min-height:100vh;
}

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header .logo{
    font-size:13px;
    font-weight:bold;
    letter-spacing:3px;
    color:var(--blue);
    margin-bottom:8px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:var(--muted);
    margin:8px 0 0;
}

.card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.card h2{
    margin:0 0 16px;
    font-size:19px;
}

label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    background:#071126;
    border:1px solid var(--line);
    color:white;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:var(--blue);
}

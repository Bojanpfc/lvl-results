<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Mobile • LVL Admin</title>

<style>
:root{
  --bg:#030814;
  --card:#0b1428;
  --card2:#101d38;
  --line:#203456;
  --blue:#2388ff;
  --blue2:#5b5cff;
  --green:#20d47b;
  --red:#ff4d5e;
  --yellow:#ffc857;
  --text:#f4f7ff;
  --muted:#8493ad;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left,#12295a 0%,transparent 35%),
    radial-gradient(circle at top right,#27135a 0%,transparent 30%),
    var(--bg);
}

.container{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:20px 14px 40px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  font-size:13px;
  font-weight:800;
  letter-spacing:3px;
  color:#6faeff;
  margin-bottom:7px;
}

.title{
  margin:0;
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}

/* CARDS */

.card{
  background:
    linear-gradient(145deg,rgba(16,29,56,.97),rgba(7,16,32,.97));
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.6px;
}

input,
select{
  width:100%;
  height:48px;
  border-radius:11px;
  border:1px solid #294166;
  background:#071124;
  color:white;
  padding:0 13px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(35,136,255,.12);
}

/* PLAYER HEADER */

.players-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.counter{
  padding:7px 12px;
  border-radius:20px;
  background:#071124;
  border:1px solid #294166;
  font-size:13px;
  font-weight:800;
}

.counter.ready{
  color:var(--green);
  border-color:rgba(32,212,123,.45);
}

.counter.error{
  color:var(--red);
  border-color:rgba(255,77,94,.45);
}

/* PLAYER LIST */

.player-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.player{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:48px;
  padding:9px 11px;
  border:1px solid #1d3150;
  background:#071124;
  border-radius:11px;
  cursor:pointer;
  transition:.15s;
  user-select:none;
}

.player:hover{
  border-color:#37649a;
  background:#0b1932;
}

.player.selected{
  border-color:var(--blue);
  background:rgba(35,136,255,.12);
}

.player input{
  width:18px;
  height:18px;
  margin:0;
  accent-color:var(--blue);
  cursor:pointer;
}

.player-name{
  font-size:14px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-id{
  margin-left:auto;
  color:#627592;
  font-size:10px;
}

/* BUTTON */

.start-btn{
  width:100%;
  height:55px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font-size:16px;
  font-weight:900;
  letter-spacing:.5px;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(35,136,255,.25);
}

.start-btn:hover{
  filter:brightness(1.08);
}

.start-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  box-shadow:none;
}

/* SECONDARY BUTTON */

.secondary-btn{
  width:100%;
  height:46px;
  border-radius:11px;
  border:1px solid #294166;
  background:#09152a;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.secondary-btn:hover{
  border-color:#4772a9;
}

/* ACTIVE LVL */

.active-box{
  display:none;
}

.active-box.show{
  display:block;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(32,212,123,.1);
  color:var(--green);
  border:1px solid rgba(32,212,123,.3);
  border-radius:20px;
  padding:6px 10px;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
}

.dot{
  width:7px;
  height:7px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 10px var(--green);
}

.active-title{
  margin-top:14px;
  font-size:27px;
  font-weight:900;
}

.active-opponent{
  margin-top:4px;
  color:var(--muted);
  font-size:14px;
}

.active-score{
  margin-top:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}

.score{
  font-size:36px;
  font-weight:900;
}

.vs{
  color:#647694;
  font-weight:800;
}

.active-meta{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.meta{
  text-align:center;
  padding:11px 6px;
  border-radius:10px;
  background:#071124;
  border:1px solid #1c3151;
}

.meta-label{
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:5px;
}

.meta-value{
  font-size:13px;
  font-weight:800;
}

/* MESSAGE */

.message{
  display:none;
  padding:13px 15px;
  border-radius:11px;
  margin-bottom:15px;
  font-size:13px;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.success{
  background:rgba(32,212,123,.09);
  border:1px solid rgba(32,212,123,.3);
  color:#8df0bc;
}

.message.error{
  background:rgba(255,77,94,.09);
  border:1px solid rgba(255,77,94,.3);
  color:#ff9aa4;
}

.message.info{
  background:rgba(35,136,255,.09);
  border:1px solid rgba(35,136,255,.3);
  color:#8dc2ff;
}

/* LOADING */

.loading{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

/* MOBILE */

@media(max-width:650px){

  .container{
    padding:15px 10px 30px;
  }

  .title{
    font-size:25px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .player-list{
    grid-template-columns:1fr;
  }

  .active-meta{
    grid-template-columns:1fr 1fr 1fr;
  }

  .card{
    padding:15px;
  }

  .active-title{
    font-size:23px;
  }

  .score{
    font-size:30px;
  }

}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">
    <div class="logo">FC MOBILE • TOURNAMENT SYSTEM</div>
    <h1 class="title">LVL ADMIN</h1>
    <div class="subtitle">
      Create and manage daily LVL tournaments
    </div>
  </div>

  <!-- MESSAGE -->

  <div id="message" class="message"></div>

  <!-- ACTIVE LVL -->

  <div id="activeBox" class="card active-box">

    <div class="live">
      <span class="dot"></span>
      ACTIVE LVL
    </div>

    <div id="activeTitle" class="active-title">
      LVL
    </div>

    <div id="activeOpponent" class="active-opponent">
      vs Opponent
    </div>

    <div class="active-score">
      <div id="activeOurScore" class="score">0</div>
      <div class="vs">-</div>
      <div id="activeOpponentScore" class="score">?</div>
    </div>

    <div class="active-meta">

      <div class="meta">
        <div class="meta-label">Players</div>
        <div id="activePlayers" class="meta-value">0 / 32</div>
      </div>

      <div class="meta">
        <div class="meta-label">Status</div>
        <div id="activeStatus" class="meta-value">LIVE</div>
      </div>

      <div class="meta">
        <div class="meta-label">Ends</div>
        <div id="activeEnd" class="meta-value">--</div>
      </div>

    </div>

  </div>


  <!-- CREATE LVL -->

  <div id="createBox" class="card">

    <div class="card-title">
      Create New LVL
    </div>

    <div class="grid">

      <div class="field">
        <label for="lvl">LVL Number</label>
        <input
          id="lvl"
          type="number"
          min="1"
          placeholder="Example: 43"
        >
      </div>

      <div class="field">
        <label for="opponent">Opponent</label>
        <input
          id="opponent"
          type="text"
          placeholder="Opponent team name"
        >
      </div>

    </div>

  </div>


  <!-- PLAYERS -->

  <div id="playersBox" class="card">

    <div class="players-header">

      <div class="card-title" style="margin:0;">
        Select Players
      </div>

      <div id="counter" class="counter">
        0 / 32
      </div>

    </div>

    <div
      id="playerList"
      class="player-list"
    >
      <div class="loading">
        Loading players...
      </div>
    </div>

  </div>


  <!-- START -->

  <div id="startBox">

    <button
      id="startBtn"
      class="start-btn"
      onclick="startLVL()"
      disabled
    >
      START LVL
    </button>

  </div>


  <!-- REFRESH -->

  <div style="margin-top:12px;">

    <button
      class="secondary-btn"
      onclick="loadData()"
    >
      ↻ Refresh
    </button>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycby3nXVRE6Z1ZB4kQA4o037qJfwoeqhTq0YOwqxVoye4pAHbp1BuZustn9qmMx-E8d19/exec";


let players = [];
let activeTournament = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type="info"){

  const box =
    document.getElementById("message");

  box.className =
    "message show " + type;

  box.textContent = text;

}


function hideMessage(){

  const box =
    document.getElementById("message");

  box.className =
    "message";

}


/* =========================
   API GET
========================= */

async function apiGet(action){

  const response =
    await fetch(
      API_URL + "?action=" + encodeURIComponent(action),
      {
        method:"GET",
        cache:"no-store"
      }
    );

  if(!response.ok){
    throw new Error(
      "HTTP error " + response.status
    );
  }

  const json =
    await response.json();

  if(!json.success){
    throw new Error(
      json.error || "API error"
    );
  }

  return json.data;

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

  hideMessage();

  try{

    await loadActiveTournament();

    await loadPlayers();

    updateStartButton();

  }catch(error){

    console.error(error);

    showMessage(
      "Could not load data: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   ACTIVE TOURNAMENT
========================= */

async function loadActiveTournament(){

  const data =
    await apiGet("activeTournament");

  activeTournament = data;

  const activeBox =
    document.getElementById("activeBox");

  const createBox =
    document.getElementById("createBox");

  const playersBox =
    document.getElementById("playersBox");

  const startBox =
    document.getElementById("startBox");


  if(!data){

    activeBox.classList.remove("show");

    createBox.style.display =
      "block";

    playersBox.style.display =
      "block";

    startBox.style.display =
      "block";

    return;

  }


  activeBox.classList.add("show");

  createBox.style.display =
    "none";

  playersBox.style.display =
    "none";

  startBox.style.display =
    "none";


  const tournament =
    data.tournament || data;


  document.getElementById("activeTitle")
    .textContent =
      "LVL " +
      (
        tournament.lvl ||
        tournament.LVL ||
        "?"
      );


  document.getElementById("activeOpponent")
    .textContent =
      "vs " +
      (
        tournament.opponent ||
        "Opponent"
      );


  document.getElementById("activeOurScore")
    .textContent =
      data.ourScore ??
      tournament.ourScore ??
      tournament["Our Score"] ??
      0;


  document.getElementById("activeOpponentScore")
    .textContent =
      data.opponentScore ??
      tournament.opponentScore ??
      tournament["Opponent Score"] ??
      "?";


  document.getElementById("activePlayers")
    .textContent =
      (
        data.submitted ??
        0
      ) +
      " / " +
      (
        data.total ??
        32
      );


  document.getElementById("activeStatus")
    .textContent =
      tournament.status ||
      "LIVE";


  const endTime =
    tournament.endTime ||
    tournament["End Time"] ||
    tournament.end_time;


  if(endTime){

    const date =
      new Date(endTime);

    if(!isNaN(date)){

      document.getElementById("activeEnd")
        .textContent =
          date.toLocaleString();

    }

  }

}


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers(){

  const list =
    document.getElementById("playerList");

  list.innerHTML =
    '<div class="loading">Loading players...</div>';


  const data =
    await apiGet("players");


  players =
    Array.isArray(data)
      ? data
      : [];


  renderPlayers();

}


/* =========================
   GET PLAYER NAME
========================= */

function getPlayerName(player){

  return (
    player["FC Name"] ||
    player.name ||
    player["Player Name"] ||
    player["Name"] ||
    player["FC_Name"] ||
    "Unknown Player"
  );

}


/* =========================
   GET PLAYER ID
========================= */

function getPlayerId(player){

  return (
    player["Player ID"] ||
    player.id ||
    player["ID"] ||
    ""
  );

}


/* =========================
   RENDER PLAYERS
========================= */

function renderPlayers(){

  const list =
    document.getElementById("playerList");

  list.innerHTML = "";


  if(players.length === 0){

    list.innerHTML =
      '<div class="loading">No players found.</div>';

    return;

  }


  players.forEach(
    (player,index)=>{

      const id =
        getPlayerId(player);

      const name =
        getPlayerName(player);


      const label =
        document.createElement("label");

      label.className =
        "player";


      label.innerHTML = `

        <input
          type="checkbox"
          class="player-checkbox"
          value="${escapeHtml(id)}"
          onchange="playerChanged(this)"
        >

        <span class="player-name">
          ${escapeHtml(name)}
        </span>

        <span class="player-id">
          ${escapeHtml(id)}
        </span>

      `;


      list.appendChild(label);

    }
  );


  updateCounter();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   PLAYER CHANGED
========================= */

function playerChanged(checkbox){

  const selected =
    document.querySelectorAll(
      ".player-checkbox:checked"
    );


  const playerCard =
    checkbox.closest(".player");


  if(checkbox.checked){

    playerCard.classList.add(
      "selected"
    );

  }else{

    playerCard.classList.remove(
      "selected"
    );

  }


  /*
    Maximum 32 players.
  */

  if(selected.length >= 32){

    document
      .querySelectorAll(
        ".player-checkbox:not(:checked)"
      )
      .forEach(
        cb => cb.disabled = true
      );

  }else{

    document
      .querySelectorAll(
        ".player-checkbox"
      )
      .forEach(
        cb => cb.disabled = false
      );

  }


  updateCounter();

}


/* =========================
   COUNTER
========================= */

function updateCounter(){

  const selected =
    document.querySelectorAll(
      ".player-checkbox:checked"
    ).length;


  const counter =
    document.getElementById("counter");


  counter.textContent =
    selected + " / 32";


  counter.classList.remove(
    "ready",
    "error"
  );


  if(selected === 32){

    counter.classList.add(
      "ready"
    );

  }else if(selected > 32){

    counter.classList.add(
      "error"
    );

  }


  updateStartButton();

}


/* =========================
   START BUTTON
========================= */

function updateStartButton(){

  const button =
    document.getElementById("startBtn");


  const lvl =
    document.getElementById("lvl")
      .value.trim();


  const opponent =
    document.getElementById("opponent")
      .value.trim();


  const selected =
    document.querySelectorAll(
      ".player-checkbox:checked"
    ).length;


  button.disabled =
    !lvl ||
    !opponent ||
    selected !== 32 ||
    !!activeTournament;

}


/* =========================
   INPUT LISTENERS
========================= */

document
  .getElementById("lvl")
  .addEventListener(
    "input",
    updateStartButton
  );


document
  .getElementById("opponent")
  .addEventListener(
    "input",
    updateStartButton
  );


/* =========================
   START LVL
========================= */

async function startLVL(){

  const lvl =
    document.getElementById("lvl")
      .value.trim();


  const opponent =
    document.getElementById("opponent")
      .value.trim();


  const selected =
    Array.from(
      document.querySelectorAll(
        ".player-checkbox:checked"
      )
    ).map(
      checkbox =>
        checkbox.value
    );


  if(!lvl){

    showMessage(
      "Enter the LVL number.",
      "error"
    );

    return;

  }


  if(!opponent){

    showMessage(
      "Enter the opponent name.",
      "error"
    );

    return;

  }


  if(selected.length !== 32){

    showMessage(
      "You must select exactly 32 players.",
      "error"
    );

    return;

  }


  const confirmed =
    confirm(
      "Start LVL " +
      lvl +
      " against " +
      opponent +
      " with " +
      selected.length +
      " players?"
    );


  if(!confirmed){

    return;

  }


  const button =
    document.getElementById("startBtn");


  button.disabled = true;

  button.textContent =
    "STARTING LVL...";


  hideMessage();


  try{

    /*
      Send as URL encoded form data.
      This avoids unnecessary CORS preflight.
    */

    const body =
      new URLSearchParams();

    body.append(
      "action",
      "startTournament"
    );

    body.append(
      "lvl",
      lvl
    );

    body.append(
      "opponent",
      opponent
    );

    body.append(
      "selectedPlayerIds",
      JSON.stringify(selected)
    );


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body:body.toString()
        }
      );


    const text =
      await response.text();


    let result;


    try{

      result =
        JSON.parse(text);

    }catch(e){

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if(!result.success){

      throw new Error(
        result.error ||
        "Could not start tournament."
      );

    }


    showMessage(
      "LVL " +
      lvl +
      " successfully started against " +
      opponent +
      ".",
      "success"
    );


    /*
      Reload everything.
    */

    await loadData();


  }catch(error){

    console.error(error);

    showMessage(
      "Could not start LVL: " +
      error.message,
      "error"
    );


    button.disabled = false;

  }


  button.textContent =
    "START LVL";

}


/* =========================
   INITIAL LOAD
========================= */

loadData();

</script>

</body>
</html>
